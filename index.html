<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>CTF: Download archive</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: linear-gradient(135deg, #0a0f1e 0%, #0c1222 100%);
            font-family: 'Courier New', monospace;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .terminal {
            background: #0a0c15;
            border-radius: 12px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.5), 0 0 0 1px rgba(0,255,255,0.1);
            width: 100%;
            max-width: 550px;
            overflow: hidden;
        }
        .terminal-header {
            background: #1a1f2e;
            padding: 10px 16px;
            display: flex;
            align-items: center;
            gap: 8px;
            border-bottom: 1px solid #2a2f3e;
        }
        .terminal-dot { width: 12px; height: 12px; border-radius: 50%; }
        .terminal-dot.red { background: #ff5f56; }
        .terminal-dot.yellow { background: #ffbd2e; }
        .terminal-dot.green { background: #27c93f; }
        .terminal-title { color: #6b7280; font-size: 12px; margin-left: 8px; }
        .terminal-content { padding: 28px 24px; }
        .prompt {
            color: #00ffcc;
            font-size: 14px;
            margin-bottom: 24px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .prompt-sign {
            background: #00ffcc20;
            padding: 4px 8px;
            border-radius: 4px;
            font-weight: bold;
        }
        .input-group { margin: 20px 0; }
        label {
            color: #8892b0;
            display: block;
            margin-bottom: 8px;
            font-size: 12px;
            letter-spacing: 1px;
        }
        input {
            width: 100%;
            background: #0f111a;
            border: 1px solid #2a2f3e;
            color: #00ffcc;
            padding: 12px 16px;
            font-family: 'Courier New', monospace;
            font-size: 14px;
            border-radius: 6px;
            outline: none;
        }
        input:focus {
            border-color: #00ffcc;
            box-shadow: 0 0 10px rgba(0,255,204,0.2);
        }
        button {
            width: 100%;
            background: linear-gradient(90deg, #00ffcc20, #00ffcc10);
            border: 1px solid #00ffcc;
            color: #00ffcc;
            padding: 12px;
            font-family: monospace;
            font-size: 14px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            margin-top: 8px;
        }
        button:hover {
            background: #00ffcc30;
            box-shadow: 0 0 15px rgba(0,255,204,0.3);
        }
        .message {
            margin-top: 20px;
            padding: 10px;
            border-radius: 6px;
            font-size: 12px;
            display: none;
        }
        .message.error {
            background: #ff000020;
            border-left: 3px solid #ff4444;
            color: #ff8888;
        }
        .message.success {
            background: #00ffcc20;
            border-left: 3px solid #00ffcc;
            color: #00ffcc;
        }
        .blink { animation: blink 1s step-end infinite; }
        @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0} }
    </style>
</head>
<body>
<div class="terminal">
    <div class="terminal-header">
        <div class="terminal-dot red"></div>
        <div class="terminal-dot yellow"></div>
        <div class="terminal-dot green"></div>
        <div class="terminal-title">web_task@ctf</div>
    </div>
<div class="terminal-content">
        <div class="prompt">
            <span class="prompt-sign">$></span>
            <span>DOWNLOAD ARCHIVE</span>
            <span class="blink">_</span>
        </div>
        <div class="input-group">
            <label>🔐 AUTHORIZATION TOKEN</label>
            <input type="password" id="accessCode" placeholder="Enter security code..." autocomplete="off">
        </div>
        <button onclick="verifyAndDownload()">⬇️ DOWNLOAD ARCHIVE</button>
        <div id="messageBox" class="message"></div>
    </div>
</div>

<script>
    const invertedExpected = [151, 138, 145, 152, 141, 134, 160, 143, 138, 152];

    function invertString(str) {
        const result = [];
        for (let i = 0; i < str.length; i++) {
            result.push(str.charCodeAt(i) ^ 0xFF);
        }
        return result;
    }

    function arraysEqual(a, b) {
        if (a.length !== b.length) return false;
        for (let i = 0; i < a.length; i++) {
            if (a[i] !== b[i]) return false;
        }
        return true;
    }

    function showMessage(text, isError = true) {
        const msgDiv = document.getElementById('messageBox');
        msgDiv.textContent = text;
        msgDiv.className = `message ${isError ? 'error' : 'success'}`;
        msgDiv.style.display = 'block';
        setTimeout(() => {
            msgDiv.style.display = 'none';
        }, 4000);
    }

    function verifyAndDownload() {
        const code = document.getElementById('accessCode').value.trim();
        if (code === "") {
            showMessage("[!] Enter token", true);
            return;
        }
        if (arraysEqual(invertString(code), invertedExpected)) {
            showMessage("[+] Access granted. Downloading...", false);
            window.location.href = 'archive.zip'; 
        } else {
            showMessage("[X] Wrong key", true);
        }
    }


    document.getElementById('accessCode').addEventListener('keypress', function(e) {
        if (e.key === 'Enter') {
            verifyAndDownload();
        }
    });
</script>
</body>
</html>
